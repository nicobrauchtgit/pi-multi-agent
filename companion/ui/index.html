<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi Multi-Agent Observability</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Local read-only companion</p>
        <h1>Pi Multi-Agent Observability</h1>
      </div>
      <p id="connection-state" class="connection-state" aria-live="polite">
        Initializing…
      </p>
    </header>
    <nav class="view-nav" aria-label="Observability views">
      <button type="button" data-view="runs">Runs</button>
      <button type="button" data-view="health">System health</button>
    </nav>
    <main id="app" tabindex="-1" aria-live="polite">
      <section class="state-panel">
        <h2>Loading</h2>
        <p>Preparing the local read-only view.</p>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
